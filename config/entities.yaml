# Entity configuration. Owner: C1 (domain owner).
# Adding a firm = a new entry here + source_registry rows. No new code.
# Unverified facts are marked TODO-verify. Never guess a CIK.
#
# Fields:
#   parent          entity whose filings contain this entity (MER -> BAC)
#   reported_as     segment name under which the parent reports it
#   equivalence     full | partial  (partial = related but not the same thing)
#   caveat          text inserted BY CODE whenever an answer uses substitute data
#   segment_aliases section headings / phrases that map a chunk to a segment tag
#   segment_stops   optional headings that end a tagged segment (other segments' names)
#   reporting_shape how the firm reports (drives what expected_sources look like)
#   expected_sources doc types that should exist; seeds source_registry
#                   (one row per entity + doc type in config/source_registry.csv)

entities:
  - id: MS
    name: Morgan Stanley
    aliases: ["Morgan Stanley", "MS", "Morgan Stanley Wealth Management", "MSWM", "E*TRADE"]
    ticker: MS
    cik: "895421"   # verified on EDGAR 2026-10-08 (#1)
    parent: null
    segment_aliases:
      Wealth Management: ["Wealth Management", "Wealth Management segment"]
    reported_as: null
    equivalence: full
    caveat: null
    reporting_shape: Public; Wealth Management is a reported segment.
    expected_sources: [10-K, 10-Q, 8-K, DEF 14A, transcript, supplement, deck, press, trade, adv]

  - id: SCHW
    name: The Charles Schwab Corporation
    aliases: ["Schwab", "Charles Schwab", "SCHW", "Schwab Advisor Services"]
    ticker: SCHW
    cik: "316709"   # verified on EDGAR 2026-10-08 (#1)
    parent: null
    segment_aliases:
      Investor Services: ["Investor Services"]
      Advisor Services: ["Advisor Services"]
    reported_as: null
    equivalence: full
    caveat: null
    reporting_shape: Public pure-play; monthly activity reports include net new assets.
    expected_sources: [10-K, 10-Q, 8-K, DEF 14A, transcript, supplement, monthly, deck, press, trade, adv]

  - id: EDJ
    name: Edward Jones (The Jones Financial Companies, L.L.L.P.)
    aliases: ["Edward Jones", "Jones Financial", "The Jones Financial Companies", "Edward D. Jones & Co."]
    ticker: null
    cik: "815917"
    parent: null
    segment_aliases: {}
    reported_as: null
    equivalence: full
    caveat: null
    reporting_shape: Partnership; files 10-K and 10-Q, no earnings calls.
    expected_sources: [10-K, 10-Q, 8-K, press, trade, adv]

  - id: BAC
    name: Bank of America Corporation
    aliases: ["Bank of America", "BofA", "BAC"]
    ticker: BAC
    cik: "70858"   # verified on EDGAR 2026-10-08 (#1)
    parent: null
    segment_aliases:
      GWIM: ["Global Wealth & Investment Management", "Global Wealth and Investment Management", "GWIM"]
      Merrill: ["Merrill Lynch Wealth Management", "Merrill Wealth Management"]
      # Merrill Edge is in Consumer Banking, not GWIM -- do not alias it here. Verified (#1):
      #   BAC-10K-2024, Consumer Banking > Deposits: "Consumer Investments serves investment client
      #   relationships through the Merrill Edge integrated investing and banking service platform".
      #   BAC-10K-2025 no longer names Merrill Edge; Consumer Banking still lists "investment accounts
      #   and products", and GWIM "consists of two primary businesses: Merrill Wealth Management and
      #   Bank of America Private Bank" (supports the MER caveat).
    # Headings that end a tagged segment without tagging (#37). Seen alone on a line in
    # BAC-10K-2025 Item 7 and BAC-10Q-2026Q2 Item 2: GWIM runs until "Global Banking".
    segment_stops: ["Consumer Banking", "Global Banking", "Global Markets", "All Other"]
    # Transcripts and press releases have no headings: a chunk there is GWIM when it names one
    # of segment_mentions and GWIM words (mentions + signals) occur at least twice as often as
    # mention_stops (other businesses). Mixed chunks stay untagged (src/cee/ingest/chunk.py).
    # Checked on BAC-TR-2026Q1..Q3 and BAC-PR-2026-*: Q3 #13 ("Merrill added about 4,200 net new
    # households") is GWIM; Q2 #13 (consumer banking, then one GWIM sentence) is not.
    segment_mentions:
      GWIM: ["GWIM", "Global Wealth", "Merrill", "Private Bank"]
    mention_signals:
      GWIM: ["adviser", "advisor", "advisers", "advisors", "households", "AUM", "wealth management",
             "wealth clients", "client balances", "brokerage"]
    mention_stops: ["Consumer Banking", "Global Banking", "Global Markets", "All Other",
                    "consumer", "commercial", "card", "investment banking", "sales and trading",
                    "markets", "trading", "deposits", "loans", "mortgage"]
    mention_excludes: ["Merrill Edge"]   # Consumer Banking platform (see the note above)
    reported_as: null
    equivalence: full
    caveat: null
    reporting_shape: Public bank; only GWIM-tagged chunks are eligible for Merrill questions.
    expected_sources: [10-K, 10-Q, 8-K, DEF 14A, transcript, supplement, deck, press]

  - id: MER
    name: Merrill
    aliases: ["Merrill", "Merrill Lynch", "Merrill Wealth Management", "Merrill Lynch Wealth Management"]
    ticker: null
    cik: "728612"   # Merrill Lynch, Pierce, Fenner & Smith Inc.; used for Form ADV only. Verified on EDGAR 2026-10-08 (#1).
                    # Not 914246 ("...SMITH INC /NY"): last filing 2016, old 40-series applications only.
    parent: BAC
    segment_aliases: {}
    reported_as: GWIM
    equivalence: partial
    caveat: "GWIM is not Merrill: the segment also includes Bank of America Private Bank."
    reporting_shape: No standalone financials; reported inside BAC segment GWIM.
    expected_sources: [press, trade, adv]   # plus BAC:*#GWIM via parent

  - id: RJF
    name: Raymond James Financial
    aliases: ["Raymond James", "RJF", "Raymond James Financial"]
    ticker: RJF
    cik: "720005"   # verified on EDGAR 2026-10-08 (#1)
    parent: null
    segment_aliases:
      Private Client Group: ["Private Client Group", "PCG"]
    reported_as: null
    equivalence: full
    caveat: null
    reporting_shape: Public; Private Client Group segment; multiple advisor affiliation models.
    expected_sources: [10-K, 10-Q, 8-K, DEF 14A, transcript, supplement, monthly, deck, press, trade, adv]   # monthly: 8-K "RJF OPERATING DATA" (#2)

# Peer sets: phrases that mean a fixed group of covered firms (S1, #89). A question that
# uses one is filtered to the members in SQL, like a question that names each firm.
# Merrill is MER (GWIM-tagged BAC chunks only), not BAC.
peer_sets:
  - id: core_five
    members: [MS, SCHW, EDJ, MER, RJF]
    phrases: ["each of the five", "across the five", "all five", "the five"]   # Q10, Q11, Q22-Q25

