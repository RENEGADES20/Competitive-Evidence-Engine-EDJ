# Theme seed list (C3 owns; see specs/thematic.md). Full taxonomy with sub-topics,
# definitions and keywords: config/topics.yaml (top-level ids must match this list).
themes:
  - {id: advice_future, label: Future of advice delivery}
  - {id: ai_advice, label: AI in advice delivery}
  - {id: fees_pricing, label: Fee structures and pricing transparency}
  - {id: younger_investors, label: Younger investors and clients under 40}
  - {id: advisor_selection, label: How clients choose a financial advisor}
  - {id: wealth_transfer, label: Generational wealth transfer}
  - {id: advisor_recruiting, label: Advisor recruiting and retention}
  - {id: mass_affluent, label: Mass-affluent clients}

# Firm themes (S1 owns; specs/retrieval.md, #117). A theme firms talk about in their own filings
# and calls that tier 5 research is not indexed by, so it is not a topic in config/topics.yaml and
# gets no research slots. In entity+theme mode a firm chunk is "on the theme" when its text has one
# of the keywords (same matching as the topic tagger: whole word or phrase, any case); each named
# firm's on-theme chunks take its slots first, and a firm with none is reported as a gap.
#   - Same concept only: "acquisition" alone is M&A, not client acquisition.
#   - Ids must not clash with config/topics.yaml ids.
firm_themes:
  - id: client_acquisition
    label: Client acquisition
    questions: [Q12]
    keywords: ["acquire new clients", "acquiring new clients", "acquire clients", "attract new clients",
               "client acquisition", "new clients", "new client", "new accounts", "new brokerage accounts",
               "new households", "new-to-firm", "client growth", "cost to acquire", "cost of acquisition"]

# Metric phrases (S1 owns; #117). Words that name a reported figure, not a theme: they never make a
# question themed, even when a topic keyword contains them. Q11 and Q23 ask for advisor headcount
# (a number per firm), not about advisor recruiting; theme slots pushed MS's supplement and RJF's
# press release out of Q23 (PASS -> FAIL).
metric_phrases: ["advisor headcount"]

# Document-type scope per question (S1 owns; #179, ADR-015). Read by doc_type_scope() in
# src/cee/retrieve/fts.py; a hard SQL filter, like the firm filter.
#   adv:       Form ADV Part 2A brochures are searched only when the question names a theme in
#              `themes` (topic keywords, config/topics.yaml) or one of `terms` (all-caps terms
#              match in exact case), and never in a question with a time window: 1,156 brochure
#              chunks crowded Q23 / Q24 and filled Q26's 90 days (#178). "compensation": the
#              brochures disclose how advisors are paid (Q25 expects MS:adv, EDJ:adv, RJF:adv).
#   benchmark: a question naming at least `min_firms` covered firms and one of `phrases` (a
#              reported metric across firms, Q22-Q24, Q28) does not search `exclude_tiers` (tier 4
#              trade press pushed MS:supplement out of Q24 and BAC:supplement out of Q28, #186).
doc_type_scope:
  adv:
    themes: [fees_pricing]
    terms: ["Form ADV", "ADV", "brochure", "brochures", "compensation"]
    never_in_window: true
  benchmark:
    min_firms: 2
    phrases: ["advisor headcount", "net new assets", "assets per advisor", "attrition rate"]
    exclude_tiers: [4]

# Query synonyms (S1 owns; see specs/retrieval.md). Draft v0 from the 30 questions (#7).
# Read by expand_synonyms() in src/cee/retrieve/fts.py (#89):
#   - expansion runs key -> values only, never back;
#   - all-caps keys (NNA, FA, FAs, AI, ...) match the question in exact case, whole word;
#     other keys match in any case, with a hyphen or spaces between their words ("stock-plan"
#     fires `stock plan`) and an inflected last word (s, es, ed, ing: `recruit` fires on
#     "recruiting", `advisor` on "advisors"; #203). Keys in `synonym_exact` (below) keep the
#     plain whole-phrase match;
#   - every value is searched as a phrase, OR'ed with the question's own words; a multi-word key
#     found in the question is searched as a phrase too (#203: "net new assets" as one phrase
#     brought the EDJ table row "Net new assets for the period" into Q22).
#
# Rules for this list:
#   - Same concept only. A neighbour metric is never a synonym: net new assets is not
#     client assets is not AUM; headcount change is not attrition (Q22, Q24, Q28).
#   - Plurals and verb forms need no entry: the key matches them (above) and the Postgres
#     english stemmer folds the searched words (advisors -> advisor, recruiting -> recruit).
#     Add only what neither folds (adviser -> advis, custodian -> custodian, retain -> retain).
#   - Firm-specific names for a metric are marked TODO-verify until seen in a stored chunk.
#   - Entity and segment names live in entities/segment_aliases above, not here.
synonyms:
  # Flows (Q1, Q22)
  NNA: ["net new assets"]
  net new assets: ["NNA", "core net new assets", "net new assets for the period"]   # EDJ-10K-2025 #130 uses "net new assets"; "core net new assets" is SCHW wording (TODO-verify in SCHW monthly); last one: EDJ 10-Q table label (Q22, #203: EDJ-10Q-2026Q2 #60)
  # Advisors and headcount (Q2, Q4, Q7, Q11, Q23)
  FA: ["financial advisor", "financial adviser"]
  FAs: ["financial advisors", "financial advisers"]
  advisor: ["adviser"]
  headcount: ["number of financial advisors", "advisor count", "financial advisors (actual)"]   # last one: EDJ-10K-2025 #130 table label
  # Attrition and retention (Q7, Q28). Net headcount change is NOT attrition; do not add it.
  attrition: ["regretted attrition", "advisor departures"]
  retention: ["retain", "retained"]
  # Recruiting (Q2, Q4, Q7). "recruit" fires on recruit/recruiting/recruits (#203). A recruiting
  # pitch is told in payout and affiliation terms (Q2: RJF's affiliation pages, "up to 50% payout").
  recruit: ["hiring", "transition assistance", "forgivable loans", "payout", "affiliation options"]
  # Assets (Q15, Q24). Kept apart on purpose: these are three different quantities.
  client assets: ["total client assets"]
  AUM: ["assets under management"]
  # Advisor channels and custody (Q3, Q6, Q8, Q14)
  RIA: ["registered investment adviser", "registered investment advisor"]
  independent advisor: ["independent advisers", "independent contractor"]   # RJF affiliation wording TODO-verify
  custody: ["custodian", "custodial"]
  affiliation model: ["affiliation options", "affiliation choice"]   # TODO-verify RJF wording
  # Pay (Q25, Q29). Gap questions: expansion must not turn a payout-grid story into a fact.
  pay: ["compensation", "payout"]
  compensation structure: ["payout grid", "compensation and benefits"]
  # Profitability (Q30)
  profitability: ["pretax margin", "pre-tax margin", "income before income taxes", "net income"]
  # Client segments and themes (Q9, Q10, Q13, Q17, Q18, Q19, Q20, Q21)
  wealth tier: ["high net worth", "ultra high net worth", "client segment"]
  mass affluent: ["mass-affluent"]
  stock plan: ["equity compensation", "workplace"]
  # Channel conversion (Q13, #203): MS calls it "channel migration" and "advisor-led assets
  # originating from workplace" (MS-TR-2026Q1 #24, MS-TR-2025Q4 #20). "originating from" fires only
  # on a question that says "convert", like every value.
  convert: ["channel migration", "originating from"]
  workplace: ["originating from workplace", "workplace channel"]
  # Deployed AI tools are named "AI-powered", "AI-enabled" (Q5, Q17, #203: MS-TR-2025Q3 #8 LeadIQ,
  # BAC-TR-2026Q2 #21).
  AI: ["artificial intelligence", "generative AI", "GenAI", "machine learning", "AI-powered", "AI-enabled",
       "AI tools", "AI-driven"]
  technology: ["AI", "artificial intelligence", "digital", "platform", "tools"]   # Q5
  fee structures: ["fee schedule", "advisory fee", "wrap fee"]
  younger investors: ["millennials", "Gen Z", "younger clients", "under 40"]
  # Q20 (#203): survey reports say "next generation" for the under-40 cohort.
  under 40: ["next generation", "younger investors", "younger clients", "millennials", "Gen Z"]
  wealth transfer: ["great wealth transfer", "intergenerational", "heirs"]
  # Segments named in questions (duplicates segment_aliases for text search only)
  GWIM: ["Global Wealth & Investment Management", "Global Wealth and Investment Management"]
  PCG: ["Private Client Group"]

# Ambiguous words searched only through their synonyms (#125). The question's synonyms are still
# read from the word; the bare word is left out of the full-text words. In filings "pay" is
# mostly "pay an obligation" (Q29: a clearing-guarantee note outranked the advisor payout passage).
synonym_only: [pay]

# Keys that keep the plain whole-phrase match: no inflected last word, no hyphen form (#203). Q25
# ("advisor compensation structures") is a gap question; with the inflected match this key brought
# "payout grid" and an RJF call turn on the payout grid (RJF-TR-2026Q1 #44) into it. Kept out so
# Q25 stays a clean gap (TL decision, #203 plan review).
synonym_exact: ["compensation structure"]
