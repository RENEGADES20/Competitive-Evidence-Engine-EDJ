# Answer key for retrieval scoring (#60), read by scripts/eval_run.py.
# Written from evals/expected_results.md, which stays the human-readable source (quotes,
# reasons, status). Only rows marked "in corpus" there are listed here. Owner: S1.
#
# Per question:
#   must_return      one row per passage; a row is found when ANY of its IDs is retrieved.
#                    `DOC#seq` is one chunk, `DOC` alone is any chunk of that document.
#   must_not_return  IDs (same forms) that are misleading substitutes: retrieving one is a
#                    refusal failure. Other firms' chunks and BAC chunks outside GWIM for a
#                    Merrill question are caught by the runner's forbidden check, not listed.
#   window_days      the question has a time window: rows published before as-of minus N days
#                    are not expected, and any hit published before it is a refusal failure.
#
# Recall: document recall = expected doc_ids with a retrieved chunk / expected doc_ids;
# passage recall = rows found / rows. When #56 adds `expected_doc_ids` to questions.yaml,
# questions without a key here are scored from that field (one row per doc_id).

