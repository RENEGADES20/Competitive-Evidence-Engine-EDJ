# After a PR is merged into main, log its "## Progress line" in docs/PROGRESS.md.
# Single writer for that file, so open PRs never conflict on it. See scripts/progress_append.py.
name: progress

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: progress-log
  cancel-in-progress: false

jobs:
  log:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Append the progress line
        run: python scripts/progress_append.py "$GITHUB_EVENT_PATH"
      - name: Commit and push
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet -- docs/PROGRESS.md; then echo "Nothing to log"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Log #${PR_NUMBER} in PROGRESS" -- docs/PROGRESS.md
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
