name: Task
description: One unit of work for one person (one issue -> one branch -> one PR)
title: "[W?][ROLE] "
labels: []
body:
  - type: dropdown
    id: role
    attributes:
      label: Role
      options: [C1, C2, C3, S1, S2, U1, TL]
    validations:
      required: true
  - type: dropdown
    id: week
    attributes:
      label: Week
      options: [W1, W2, W3, W4, W5, W6, W7, W8, W9, W10, W11, W12]
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem, which questions (Q..) or gate this moves, what depends on it.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What will be true when this is done, in plain language.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Inputs
      description: Files, specs, issues, PRs and comments to read first.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: What the PR will contain.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Items someone else can check - a command and its expected output, a question ID with its expected behavior, a row count, a verify-cee feature that must PASS.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: What to run before /finish-task (verify-cee features, retrieval check, pytest) and on which snapshot.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: What not to touch, so this stays one PR.
    validations:
      required: true
  - type: textarea
    id: depends_on
    attributes:
      label: Depends on
      description: Issues or PRs that must land first, or "nothing".
  - type: input
    id: questions
    attributes:
      label: Linked question IDs
      placeholder: "Q4, Q27, Q30"
  - type: input
    id: spec
    attributes:
      label: Spec
      placeholder: "specs/retrieval.md"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size
      options: ["S (under half a day)", "M (1-2 days)", "L (split this issue)"]
    validations:
      required: true
