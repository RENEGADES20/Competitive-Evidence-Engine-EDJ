# Local Postgres for the Competitive Evidence Engine. See docs/RUN.md.
# db/schema.sql and db/upgrade.sql run on the first start of an empty volume;
# restore.ps1 / restore.sh run db/upgrade.sql again after every restore.
# Only core SQL is mounted. db/optional/vectors.sql (the optional vectors module, ADR-009) is
# applied by the scripts only when CEE_VECTORS=on, so it must never be an init file here.
services:
  db:
    image: pgvector/pgvector:0.8.1-pg16-trixie   # Postgres 16 + pgvector (x86 and Apple chip)
    # The core needs plain Postgres 16; the image also carries pgvector so that turning vectors on
    # (CEE_VECTORS=on) needs no new image. The extension is created only by db/optional/vectors.sql.
    container_name: cee-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cee
      POSTGRES_PASSWORD: cee
      POSTGRES_DB: cee
    ports:
      - "5432:5432"
    volumes:
      - cee-pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/upgrade.sql:/docker-entrypoint-initdb.d/02-upgrade.sql:ro
      - ./snapshots:/snapshots   # staging area for pg_dump / pg_restore
    healthcheck:
      # Over TCP on purpose: on a new volume the image first runs db/schema.sql on a temporary
      # server that listens on the Unix socket only, then restarts. Checking the socket would
      # report "healthy" too early and the next psql call would hit "shutting down".
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cee -d cee"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  cee-pgdata:
