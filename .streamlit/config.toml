# Theme for the Competitive Evidence Engine. Values and contrast ratios: docs/DESIGN.md.
# Extra CSS lives in one place only: src/cee/app/components.py (CSS constant).

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#1C2321"
backgroundColor = "#F3F1EA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C2321"
linkColor = "#1C2321"
borderColor = "#D6D3CB"
baseRadius = "12px"
buttonRadius = "8px"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap, monospace"

[theme.sidebar]
backgroundColor = "#ECEAE3"
