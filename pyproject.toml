[project]
name = "cee"
version = "0.1.0"
description = "Competitive Evidence Engine prototype"
requires-python = ">=3.11,<3.12"

[project.optional-dependencies]
# Optional vectors module (ADR-009), off by default. Same pins as requirements-vectors.txt.
vectors = ["fastembed==0.9.1", "onnxruntime==1.23.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest_tmp"
